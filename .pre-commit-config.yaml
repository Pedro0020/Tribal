repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, -f, txt, -x, .venv,tests,agents/tests]
        stages: [push]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^(tribal|tests)/
        stages: [push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # project.yml NO es YAML: es una lista plana `clave: valor` que parsea
      # agents/config.py (una descripción con `: ` dentro del valor rompe el
      # parser YAML). Validarlo como YAML es un falso positivo permanente.
      - id: check-yaml
        exclude: ^project\.yml$
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
